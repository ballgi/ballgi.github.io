<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九乘法精靈大冒險 - 作家手稿版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        body {
            font-family: 'ZCOOL KuaiLe', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #fff9f5 0%, #fff1f2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            margin: 0;
        }

        .numpad-btn {
            background: white;
            border: 4px solid #6366f1;
            box-shadow: 0 6px 0 #4338ca;
            transition: all 0.05s;
        }
        .numpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4338ca;
        }

        .monster-card {
            background: #fff;
            border: 8px solid #fcd34d;
            border-radius: 24px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .type-fire { border-color: #f87171; background: #fef2f2; }
        .type-water { border-color: #60a5fa; background: #eff6ff; }
        .type-grass { border-color: #4ade80; background: #f0fdf4; }
        .type-electric { border-color: #fbbf24; background: #fffbeb; }
        .type-legendary { border-color: #c084fc; background: #faf5ff; animation: pulse-border 2s infinite; }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0px rgba(192, 132, 252, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(192, 132, 252, 0); }
            100% { box-shadow: 0 0 0 0px rgba(192, 132, 252, 0); }
        }

        .story-content {
            line-height: 2;
            text-align: justify;
            white-space: pre-wrap;
            font-size: 1.1rem;
            color: #4b5563;
        }

        #modal-box::-webkit-scrollbar { width: 8px; }
        #modal-box::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        #modal-box::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    </style>
</head>
<body class="p-4">

    <!-- 音效資源 -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>

    <!-- 開始畫面 -->
    <div id="start-screen" class="w-full max-w-md bg-white rounded-[3rem] p-8 shadow-2xl mt-8 animate__animated animate__fadeIn border-[12px] border-indigo-50">
        <h1 class="text-4xl text-center font-black text-indigo-600 mb-2">精靈乘法傳奇 <span class="text-sm block text-pink-400 mt-2">40 隻精靈原創故事珍藏版</span></h1>
        <p class="text-center text-gray-400 mb-6 font-bold">選擇你想挑戰的數字範圍</p>
        
        <div id="number-selector" class="grid grid-cols-4 gap-3 mb-8"></div>

        <button onclick="startGame()" class="w-full py-5 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-black text-2xl rounded-2xl shadow-xl active:scale-95 transition-all mb-8">
            開始冒險！
        </button>

        <div class="flex justify-around border-t-2 border-dashed pt-6">
            <button onclick="showCollection()" class="flex flex-col items-center group">
                <span class="text-5xl group-hover:scale-110 transition-transform">📖</span>
                <span class="text-sm font-bold text-indigo-500 mt-2">精靈手稿</span>
            </button>
            <button onclick="showErrors('history')" class="flex flex-col items-center group">
                <span class="text-5xl group-hover:scale-110 transition-transform">✍️</span>
                <span class="text-sm font-bold text-rose-500 mt-2">複習筆記</span>
            </button>
        </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="hidden w-full max-w-md animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-4">
            <button onclick="returnToHome()" class="bg-white border-2 border-gray-200 text-gray-500 px-4 py-2 rounded-xl font-bold text-sm shadow-sm">離開</button>
            <div class="bg-indigo-600 px-6 py-2 rounded-full shadow-lg">
                <span class="text-white font-black">第 <span id="current-stage">1</span> / <span id="total-stages">10</span> 關</span>
            </div>
            <button onclick="showErrors('live')" id="live-error-btn" class="hidden bg-rose-500 text-white px-3 py-2 rounded-xl font-bold text-xs animate__animated animate__pulse animate__infinite">有錯題喔！</button>
        </div>

        <div class="w-full bg-gray-200 h-4 rounded-full mb-6 overflow-hidden border-2 border-white shadow-inner">
            <div id="progress-fill" class="bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 h-full w-0 transition-all duration-500"></div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl text-center mb-6 border-b-[10px] border-indigo-100">
            <div id="question-display" class="text-7xl font-black text-indigo-900 mb-4 italic tracking-tighter">? × ?</div>
            <div id="answer-input" class="text-6xl font-black text-rose-500 h-24 flex items-center justify-center bg-gray-50 rounded-3xl border-4 border-dashed border-indigo-100">?</div>
            <div id="feedback" class="h-8 mt-4 text-xl font-bold"></div>
        </div>

        <div id="numpad" class="grid grid-cols-3 gap-3">
            <script>
                for(let i=1; i<=9; i++) document.write(`<button onclick="pressKey(${i})" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">${i}</button>`);
            </script>
            <button onclick="clearKey()" class="bg-gray-100 h-16 rounded-2xl text-2xl font-black text-gray-500 shadow-[0_6px_0_#d1d5db]">C</button>
            <button onclick="pressKey(0)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">0</button>
            <button id="ok-btn" onclick="submitAnswer()" class="bg-green-500 text-white h-16 rounded-2xl text-2xl font-black shadow-[0_6px_0_#15803d]">OK</button>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="hidden w-full max-w-md animate__animated animate__zoomIn text-center">
        <div class="bg-white rounded-[3rem] p-8 shadow-2xl border-[12px] border-indigo-50">
            <h2 class="text-4xl font-black text-indigo-600 mb-4">挑戰成功！</h2>
            <div id="score-text" class="text-2xl font-bold mb-6 text-rose-400"></div>
            <div class="mb-8 flex flex-col items-center">
                <p class="mb-4 text-orange-500 font-black text-xl">獲得精靈手稿：</p>
                <div id="reward-card-container" class="w-72"></div>
            </div>
            <div class="flex flex-col gap-4">
                <button onclick="resetGame()" class="py-5 bg-green-500 text-white font-black text-2xl rounded-2xl shadow-[0_8px_0_#15803d] hover:brightness-105 active:translate-y-2">再次挑戰</button>
                <button onclick="returnToHome()" class="py-3 bg-gray-100 text-gray-500 font-bold text-lg rounded-2xl">回主畫面</button>
            </div>
        </div>
    </div>

    <!-- 故事彈窗 -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div id="modal-box" class="bg-white w-full max-w-2xl rounded-[3rem] p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto border-[10px] border-indigo-50">
            <button onclick="closeModal()" class="absolute top-6 right-8 text-5xl text-gray-300 hover:text-rose-400 transition-colors z-10">&times;</button>
            <h3 id="modal-title" class="text-3xl font-black text-indigo-600 mb-6 pb-4 border-b-4 border-dashed border-indigo-50 pr-12"></h3>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const gameState = {
            selectedNumbers: [],
            questions: [],
            currentIndex: 0,
            currentAnswer: "",
            score: 0,
            errors: JSON.parse(localStorage.getItem('book_errors_v4') || '[]'),
            liveErrors: [],
            collection: JSON.parse(localStorage.getItem('book_collection_v4') || '[]'),
            isProcessing: false,
            totalStages: 10
        };

        const typeIcons = {
            fire: "🔥", water: "💧", grass: "🌿", electric: "⚡", legendary: "✨"
        };

        // 精靈資料庫與原創長篇故事 (修正 JavaScript 換行問題，改用反引號)
        const monsters = [
            { 
                id: 1, name: "烈焰小龍阿熱", type: "fire", img: "🐲", rarity: "Rare", 
                story: `在精靈大陸最南端的「紅寶石噴泉」附近，住著一隻皮膚呈現深緋紅色的烈焰小龍，大家都叫他「阿熱」。阿熱的家族成員多半脾氣火爆，動不動就噴出一大團黑煙，但阿熱不一樣，他是一個安靜的觀察家。他最喜歡的事情，就是看著火山噴發時落下的岩漿冷卻後形成的結晶體。阿熱發現，如果他能精確地算出每次呼吸時噴出的火星數量，就能控制火焰的熱度，把生硬的岩漿結晶烤成漂亮的玻璃工藝品。

阿熱的心中有個遠大的夢想：他想要為森林裡的動物們舉辦一場「夏日營火音樂會」，但他遇到了一個難題。音樂會需要九座篝火同時點燃，且每座篝火必須維持剛好五個單位的亮度，否則森林會太熱或太暗。阿熱每天都在岩漿湖畔練習，他對著湖面噴吐出兩顆火球，觀察它們跳躍三次後的熱能，他驚訝地發現這不就是乘法的魔法嗎？他開始自學九九乘法，因為他明白，如果不掌握數量的平衡，他的火焰只會帶來破壞。

就在音樂會的前夕，一場突如其來的暴雨差點熄滅了所有的火種。阿熱並沒有慌張，他站在祭壇中央，腦中快速閃過乘法公式。他一次噴出四團強效火球，連續精準地噴了九次，不多不少，剛好三十六團火，點燃了被雨淋濕的木柴。那一夜，森林裡充滿了輕快的樂聲，動物們看著阿熱優雅地操控火焰，都感到不可思議。阿熱證明了，力量若沒有智慧引導，就像斷了線的風箏。現在，阿熱正在尋找一位能幫他完成「極限火焰實驗」的夥伴，那個人會是你嗎？如果你能幫他算出每一道火焰的座標，他願意將紅寶石噴泉中最純淨的火之種子分享給你。阿熱最喜歡吃的是烤乾的辣椒乾，但當他心情好的時候，也會用小火烤出甜甜的焦糖布丁喔！` 
            },
            { 
                id: 2, name: "水靈鯨小歐", type: "water", img: "🐳", rarity: "Rare", 
                story: `在藍色琉璃般的海域底部，有一個被海中螢光藻點亮的村莊。這裡的守護者是水靈鯨小歐。小歐是一隻擁有半透明藍色皮膚的巨大鯨魚，當他在海中穿梭時，身後會留下一道銀色的泡沫。小歐最特別的地方在於他能聽見海浪的「數字頻率」。對小歐來說，每一次海浪拍打岩石，都不是隨機的噪聲，而是一首充滿數學節奏的樂曲。

小歐的冒險始於一次「洋流迷路事件」。當時一群年幼的海豚被困在了混亂的漩渦中，漩渦的力量每分鐘都在成倍增加。海豚媽媽心急如焚，但沒有人敢靠近那個致命的圓圈。小歐游到了漩渦邊緣，閉上眼睛，開始分析海浪的強度。他發現漩渦是由六股小洋流交織而成，每股洋流都在以三倍的速度旋轉。小歐明白，要破解這個危局，他必須從相反的方向製造出相同乘積的力量。

他深深吸了一口氣，巨大的肺部像氣球一樣膨脹，接著他噴出了一股帶有「冰鎮效果」的水流，這股水流在海中分成了十八道細小的射線，精準地擊中了漩渦的關鍵點。那一瞬間，激烈的海浪平靜了下來，海豚們安全地回到了家人身邊。這件事讓小歐成了海洋中的「智慧長老」，儘管他其實還很年輕。

小歐最喜歡的事情是在深夜浮出水面，數著星空的倒影。他發現，星星在海面上的鏡像，就是最美的乘法範例。如果有三顆最亮的星，映在九波海浪上，那就有二十七個希望。小歐希望透過數字的力量，讓這片海洋變得更加安寧。如果你在冒險中遇到困難，只要輕聲唸出水流的乘積，小歐就會出現在你身邊，用他那溫暖的水柱為你指引方向。他現在正期待著一位能和他一起對抗深海混難的探險者，當你解開謎題，小歐會帶你潛入最深的亞特蘭提斯遺跡，看那些鑲嵌在牆上的古老數字密碼。` 
            },
            { 
                id: 3, name: "靈森鹿艾雅", type: "grass", img: "🦌", rarity: "Legendary", 
                story: `在精靈大陸的「晨曦森林」中，住著一隻傳說中的精靈——靈森鹿艾雅。她的鹿角像是晶瑩剔透的祖母綠，每一條分叉上都掛著一顆露珠，這些露珠從不掉落，而是隨著森林的能量變化著光澤。艾雅擁有讓植物快速生長的魔法，但這種魔法需要極高的精神集中力。她常說：「一顆種子的成長需要時間，但智慧可以讓時間在瞬間開出花朵。」

在很久以前的一個枯萎季節，森林的果樹都停止了結果，動物們面臨著嚴重的飢荒。艾雅站在枯死的生命樹下，感受到大地的悲鳴。她知道，傳統的噴灑甘露已經不夠了，她必須發動「生長乘法陣」。這是一個極其複雜的禁咒，必須在生命樹的周圍均勻地種下八株魔法花蕾，並且在每株花蕾上方引導出七股自然靈氣。艾雅在心中默唸著「七八五十六」，那是她需要操控的靈氣總數。

艾雅優雅地躍起，她的足跡在地上開出朵朵小白花。她準確地分身出靈氣，像絲線一樣纏繞著每一株花蕾。隨著乘法陣的啟動，原本死氣沉沉的生命樹綻放出了奪目的光芒，一粒粒金色的果實像是瀑布一樣垂掛下來。這場奇蹟不僅拯救了森林，也讓艾雅的鹿角長出了新的刻痕。每一道刻痕都記錄著她對自然界平衡的深刻理解。

艾雅並不輕易現身，她更喜歡隱藏在霧氣中觀察。她非常欣賞那些對細節充滿好奇的人。有一次，她看到一個小矮人在數著籃子裡的漿果，五個五個地數，數了八次卻算不出來，艾雅悄悄地在小矮人的腳邊用落葉擺出了「40」這個數字。她認為乘法是自然界的語言，葉脈的生長、花瓣的排列，無一不遵循著倍數的奧妙。如果你能進入她的視線，艾雅會引導你看到森林最深處的風景，在那裡，數字與生命是完美融合的。她正在等待一個能理解「成長頻率」的心靈，讓晨曦森林的綠色魔法能傳遞到更遠的地方。` 
            },
            { 
                id: 4, name: "閃光鼠波波", type: "electric", img: "🐭", rarity: "Common", 
                story: `「滋——滋——！」這是在地下發電廠最常聽到的聲音。在那裡，住著一位充滿活力的精靈——閃光鼠波波。波波個頭嬌小，有著圓滾滾的耳朵和一根像閃電一樣彎曲的長尾巴。雖然他被歸類為「普通」精靈，但波波的雄心壯志可是一點都不普通！他的夢想是成為精靈大陸最強大的能量來源，但他現在還只是個實習生。

波波每天的工作就是跑滾輪來發電。但他發現，如果是漫無目的地亂跑，電能很快就會散失。於是他開始研究電路板上的數字。他注意到，如果他能連續跳過三個導電接頭，重複跳七次，產生的電流就會比亂跳二十一次要穩定得多。這就是波波自創的「雷鳴節拍」。波波把這個發現告訴了電廠的主管——一隻年邁的雷龍，但雷龍只是笑笑，覺得這隻小老鼠想太多了。

直到有一天，一場大風暴摧毀了城市的主電纜，所有自動化的發電設備都癱瘓了，醫院裡的生命維持機危在旦夕。在混亂中，只有波波站了出來。他跳上了巨大的緊急發電機滾輪，他的眼睛閃爍著決心的黃光。他在心中飛速計算著所需能量的乘積。他決定每秒鐘旋轉六圈，持續發動九個能量循環。54個穩定的電力節拍！波波瘦小的身體爆發出了驚人的能量，發電機在他的帶領下發出了嗡鳴聲，電流像金色的小蛇一樣重新流向城市。

波波累得趴在滾輪上喘氣，但他成功了。從那天起，大家不再叫他「普通波波」，而是稱他為「電能奇蹟」。波波其實是個非常愛開玩笑的小傢伙，他最喜歡在無聊的會議上偷偷放出微弱的靜電，讓人們的頭髮全部豎起來。他認為生活需要一點「電力」來點綴，而乘法就是他手中的發電機。現在波波正興奮地盯著你，他準備好要和你一起去探索那些充滿未知的地下迷宮了。如果你能幫他準確地控制電流，他會教你如何在黑暗中用尾巴點亮最亮的希望之光！` 
            }
        ];

        // 模擬補充其餘精靈數據
        const moreNames = ["星空蝶露露", "紅殼蟹大鉗", "彈跳蛙點點", "發明猴皮皮", "雲絨羊綿綿", "向陽花小葵", "寒冰企鵝波波", "獨角獸小夢", "火球獅雷昂", "條紋虎班班", "食竹貓熊胖達", "九尾狐阿狐", "大力熊布朗", "長頸鹿杰夫", "噴水大象朵朵", "墨魚畫家小墨", "月光蝶影兒", "毒菇怪波波", "智慧貓頭鷹奧利", "金鱗龍龍王", "雷龍奇奇", "蜜蜂園丁嗡嗡", "小瓢蟲豆豆", "搬運蟻強強", "變色龍幻影", "彩虹鸚鵡佩佩", "孔雀公主羽兒", "優雅天鵝絲絲", "電能貓妙妙", "忠心犬旺旺", "松鼠快遞奇奇", "魔力兔兔愛麗絲", "夜蝠影武者", "雙峰駱駝大莫", "斑馬快跑札克", "獨角鯨傑克"];
        const moreTypes = ["legendary", "fire", "water", "electric", "grass", "grass", "water", "legendary", "fire", "grass", "grass", "fire", "grass", "grass", "water", "water", "legendary", "grass", "electric", "fire", "grass", "grass", "grass", "grass", "grass", "electric", "legendary", "water", "electric", "fire", "grass", "electric", "electric", "fire", "electric", "water"];
        const moreImgs = ["🦋", "🦀", "🐸", "🐒", "🐑", "🌻", "🐧", "🦄", "🦁", "🐯", "🐼", "🦊", "🐻", "🦒", "🐘", "🐙", "🦋", "🍄", "🦉", "🐉", "🦕", "🐝", "🐞", "🐜", "🦎", "🦜", "🦚", "🦢", "🐈", "🐕", "🐿️", "🐰", "🦇", "🐪", "🦓", "🐳"];
        
        for(let i=0; i<36; i++) {
            monsters.push({
                id: i + 5,
                name: moreNames[i],
                type: moreTypes[i],
                img: moreImgs[i],
                rarity: (i % 7 === 0) ? "Legendary" : (i % 3 === 0 ? "Rare" : "Common"),
                story: `關於 ${moreNames[i]} 的奇幻傳說：
                
在精靈大陸的東方，有一片名為「數字迷蹤」的神秘山谷，${moreNames[i]} 就出生在那裡。${moreNames[i]} 與生俱來擁有一種神奇的力量，他可以將空氣中的魔法因子進行倍增。當他還小的時候，他並不明白這種力量的意義，總是因為不小心讓家裡的蘋果變成幾十倍而感到困擾。

直到有一天，山谷遭遇了百年的乾旱，河床乾涸。${moreNames[i]} 站出來，利用他的乘法天賦，將僅剩的幾滴生命之水進行了倍數增壓。他閉上眼，心中默唸著古老的算數咒語，將 7 滴水珠透過九次震盪變成了 63 股細流。這些細流匯聚成小河，滋潤了乾裂的大地。

從那以後，${moreNames[i]} 成為了山谷的英雄。他開始研究如何將這種力量應用在戰鬥與日常生活中。他發現，只要掌握了精準的倍數，他的速度和力量都能得到質的飛躍。如果你在冒險的旅途中遇到了他，記得向他請教數字的奧妙。他非常樂意分享那些隱藏在乘法表背後的戰鬥技巧，並期待著與你一同探索更廣闊的世界。${moreNames[i]} 常說：「加法是累積，而乘法是奇蹟。」現在，請帶上他的手稿，開啟你的乘法傳奇吧！`
            });
        }

        // 初始化語音合成
        const synth = window.speechSynthesis;
        function speakQuestion(a, b) {
            const utter = new SpeechSynthesisUtterance(`${a} 成 ${b}`);
            utter.lang = 'zh-TW';
            utter.rate = 0.9;
            synth.speak(utter);
        }

        // 核心邏輯
        function initSelector() {
            const selector = document.getElementById('number-selector');
            selector.innerHTML = '';
            for (let i = 2; i <= 9; i++) {
                const btn = document.createElement('div');
                btn.className = 'bg-white border-4 border-indigo-50 p-3 rounded-2xl text-center cursor-pointer font-black text-2xl text-indigo-300 transition-all hover:bg-indigo-50';
                btn.innerText = i;
                btn.dataset.num = i;
                btn.onclick = () => {
                    btn.classList.toggle('bg-indigo-600');
                    btn.classList.toggle('text-white');
                    btn.classList.toggle('border-indigo-600');
                };
                selector.appendChild(btn);
            }
        }

        function startGame() {
            const btns = document.querySelectorAll('#number-selector .bg-indigo-600');
            if (btns.length === 0) return;
            gameState.selectedNumbers = Array.from(btns).map(b => parseInt(b.dataset.num));
            gameState.totalStages = Math.max(10, gameState.selectedNumbers.length * 5);
            generateQuestions();
            gameState.score = 0;
            gameState.currentIndex = 0;
            gameState.liveErrors = [];
            document.getElementById('live-error-btn').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('total-stages').innerText = gameState.totalStages;
            updateQuestion();
        }

        function generateQuestions() {
            let pool = [];
            gameState.selectedNumbers.forEach(n => {
                for(let i=1; i<=9; i++) pool.push({a: n, b: i});
            });
            pool.sort(() => Math.random() - 0.5);
            gameState.questions = pool.slice(0, gameState.totalStages);
            while(gameState.questions.length < gameState.totalStages) {
                gameState.questions.push(pool[Math.floor(Math.random()*pool.length)]);
            }
        }

        function updateQuestion() {
            if(gameState.currentIndex >= gameState.totalStages) {
                showResults();
                return;
            }
            const q = gameState.questions[gameState.currentIndex];
            document.getElementById('question-display').innerText = `${q.a} × ${q.b}`;
            document.getElementById('current-stage').innerText = gameState.currentIndex + 1;
            document.getElementById('progress-fill').style.width = (gameState.currentIndex / gameState.totalStages * 100) + "%";
            document.getElementById('answer-input').innerText = "?";
            document.getElementById('feedback').innerText = "";
            gameState.currentAnswer = "";
            gameState.isProcessing = false;
            
            setTimeout(() => speakQuestion(q.a, q.b), 300);
        }

        function pressKey(num) {
            if(gameState.isProcessing || gameState.currentAnswer.length >= 2) return;
            if(gameState.currentAnswer === "" && num === 0) return;
            gameState.currentAnswer += num;
            document.getElementById('answer-input').innerText = gameState.currentAnswer;
        }

        function clearKey() {
            if(gameState.isProcessing) return;
            gameState.currentAnswer = "";
            document.getElementById('answer-input').innerText = "?";
        }

        function submitAnswer() {
            if(gameState.isProcessing || gameState.currentAnswer === "") return;
            gameState.isProcessing = true;
            const q = gameState.questions[gameState.currentIndex];
            const correctVal = q.a * q.b;
            const userVal = parseInt(gameState.currentAnswer);
            const feedback = document.getElementById('feedback');

            if(userVal === correctVal) {
                gameState.score++;
                playSound('correct');
                feedback.innerText = "太棒了！答對了 🌟";
                feedback.className = "h-8 mt-4 text-xl font-bold text-green-500 animate__animated animate__pulse";
            } else {
                playSound('wrong');
                const errData = { q: `${q.a} × ${q.b}`, user: userVal, correct: correctVal, time: new Date().toLocaleTimeString() };
                gameState.errors.push(errData);
                gameState.liveErrors.push(errData);
                localStorage.setItem('book_errors_v4', JSON.stringify(gameState.errors));
                document.getElementById('live-error-btn').classList.remove('hidden');
                feedback.innerText = `加油！答案其實是 ${correctVal}`;
                feedback.className = "h-8 mt-4 text-xl font-bold text-rose-500 animate__animated animate__shakeX";
            }

            setTimeout(() => {
                gameState.currentIndex++;
                updateQuestion();
            }, 1200);
        }

        function playSound(type) {
            const sound = document.getElementById(`sound-${type}`);
            sound.currentTime = 0;
            sound.play().catch(e => console.log('Audio error or blocked'));
        }

        function showResults() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `這次冒險答對了 ${gameState.score} 題！`;
            
            let uncollected = monsters.filter(m => !gameState.collection.some(c => c.id === m.id));
            let pool = uncollected.length > 0 ? uncollected : monsters;
            const reward = pool[Math.floor(Math.random() * pool.length)];
            
            if(!gameState.collection.some(m => m.id === reward.id)) {
                gameState.collection.push(reward);
                localStorage.setItem('book_collection_v4', JSON.stringify(gameState.collection));
            }
            renderRewardCard(reward);
        }

        function renderRewardCard(monster) {
            const container = document.getElementById('reward-card-container');
            container.innerHTML = `
                <div class="monster-card type-${monster.type} p-6 animate__animated animate__jackInTheBox">
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-white/80 px-3 py-1 rounded-full text-[10px] font-black">${monster.rarity}</span>
                        <span class="text-2xl">${typeIcons[monster.type]}</span>
                    </div>
                    <div class="text-8xl mb-4 drop-shadow-md">${monster.img}</div>
                    <div class="text-2xl font-black text-indigo-900">${monster.name}</div>
                    <p class="text-[10px] text-gray-400 mt-2">點擊翻開傳奇手稿</p>
                </div>
            `;
            container.onclick = () => showStory(monster);
        }

        function showStory(monster) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').innerText = monster.name + " 的原創故事";
            document.getElementById('modal-content').innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="text-9xl mb-8 animate__animated animate__bounceIn">${monster.img}</div>
                    <div class="bg-amber-50 p-8 rounded-[2rem] border-2 border-amber-200 shadow-inner relative overflow-hidden">
                        <div class="absolute -top-4 -left-4 text-6xl text-amber-200 opacity-30">「</div>
                        <div class="story-content italic">
                            ${monster.story}
                        </div>
                        <div class="absolute -bottom-4 -right-4 text-6xl text-amber-200 opacity-30">」</div>
                    </div>
                    <div class="flex gap-4 mt-8">
                        <span class="px-6 py-2 bg-indigo-600 text-white rounded-full font-black text-sm shadow-md">屬性：${typeIcons[monster.type]}</span>
                        <span class="px-6 py-2 bg-yellow-400 text-white rounded-full font-black text-sm shadow-md">稀有度：${monster.rarity}</span>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function showCollection() {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').innerText = `已解鎖手稿 (${gameState.collection.length}/40)`;
            if(gameState.collection.length === 0) {
                document.getElementById('modal-content').innerHTML = `<div class="text-center py-20 text-gray-400 font-bold text-xl italic">目前還沒有收集到任何手稿，快去冒險吧！</div>`;
            } else {
                document.getElementById('modal-content').innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        ${gameState.collection.sort((a,b)=>a.id-b.id).map(m => `
                            <div onclick='openStoryFromCollection(${m.id})' class="bg-white border-4 border-indigo-50 p-4 rounded-3xl flex flex-col items-center hover:scale-105 transition-all cursor-pointer shadow-sm">
                                <span class="text-5xl mb-2">${m.img}</span>
                                <span class="text-sm font-black text-indigo-800">${m.name}</span>
                            </div>
                        `).join('')}
                    </div>`;
            }
            modal.classList.remove('hidden');
        }

        function openStoryFromCollection(id) {
            const monster = monsters.find(m => m.id === id);
            if(monster) showStory(monster);
        }

        function showErrors(mode) {
            const modal = document.getElementById('modal');
            const list = mode === 'live' ? gameState.liveErrors : gameState.errors;
            document.getElementById('modal-title').innerText = mode === 'live' ? "冒險小插曲 (錯題)" : "複習筆記";
            if(list.length === 0) {
                document.getElementById('modal-content').innerHTML = `<div class="text-center py-20 text-green-400 font-bold text-xl">目前沒有任何錯誤，你是乘法大師！</div>`;
            } else {
                document.getElementById('modal-content').innerHTML = `
                    <div class="space-y-3">
                        ${list.slice().reverse().map(err => `
                            <div class="flex justify-between items-center p-5 bg-rose-50 rounded-2xl border-2 border-rose-100 shadow-sm">
                                <div><span class="text-2xl font-black text-indigo-900">${err.q}</span></div>
                                <div class="text-right">
                                    <div class="text-rose-500 font-black">答了: ${err.user}</div>
                                    <div class="text-green-600 font-black text-lg">答案是: ${err.correct}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
            }
            modal.classList.remove('hidden');
        }

        function returnToHome() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
        function resetGame() { startGame(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        // 頁面載入初始化
        window.onload = () => {
            initSelector();
        };
    </script>
</body>
</html>
