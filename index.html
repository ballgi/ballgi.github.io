<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九乘法大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        body {
            font-family: 'ZCOOL KuaiLe', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
            overflow-x: hidden;
            margin: 0;
        }

        .numpad-btn {
            background: white;
            border: 4px solid #4f46e5;
            box-shadow: 0 6px 0 #3730a3;
            transition: all 0.05s;
            user-select: none;
        }
        .numpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3730a3;
        }

        .monster-card {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            border: 6px solid #fbbf24;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .card-legendary { border-color: #f59e0b; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); }
        .card-rare { border-color: #8b5cf6; background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); }

        .progress-bar-inner {
            transition: width 0.3s ease-out;
        }

        .modal-bg {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }

        .btn-locked-ui {
            filter: grayscale(1);
            opacity: 0.5;
            pointer-events: none;
        }

        .nav-header {
            position: relative;
            z-index: 50;
        }
    </style>
</head>
<body class="p-2 sm:p-4">

    <!-- 開始畫面 -->
    <div id="start-screen" class="w-full max-w-md bg-white rounded-[2.5rem] p-6 shadow-2xl mt-6 animate__animated animate__fadeInDown border-8 border-indigo-50">
        <h1 class="text-3xl text-center font-black text-indigo-600 mb-2">精靈乘法大戰</h1>
        <p class="text-center text-gray-500 mb-4 font-bold">選擇練習範圍 (可多選)</p>
        
        <div id="number-selector" class="grid grid-cols-4 gap-2 mb-6">
            <!-- JS 生成 2-9 按鈕 -->
        </div>

        <button onclick="startGame()" class="w-full py-4 bg-yellow-400 hover:bg-yellow-500 text-indigo-900 font-black text-2xl rounded-2xl shadow-[0_8px_0_#d97706] active:translate-y-2 active:shadow-none transition-all mb-6">
            開始冒險！
        </button>

        <div class="flex justify-around border-t pt-4">
            <button onclick="showCollection()" class="flex flex-col items-center">
                <span class="text-3xl">🎒</span>
                <span class="text-xs font-bold text-indigo-500 mt-1">精靈圖鑑</span>
            </button>
            <button onclick="showErrors()" class="flex flex-col items-center">
                <span class="text-3xl">📖</span>
                <span class="text-xs font-bold text-rose-500 mt-1">錯題筆記</span>
            </button>
        </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="hidden w-full max-w-md animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-3 nav-header">
            <button onclick="returnToHome()" class="bg-gray-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-md active:scale-95">🏠 回首頁</button>
            <div class="bg-white px-4 py-1.5 rounded-full shadow-md border-2 border-indigo-100">
                <span class="text-indigo-600 font-black text-sm">第 <span id="current-stage">1</span> / 10 關</span>
            </div>
            <button onclick="showErrors()" class="bg-rose-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-md active:scale-95">📖 查錯題</button>
        </div>

        <div class="w-full bg-white/50 h-4 rounded-full mb-4 overflow-hidden border-2 border-white shadow-inner">
            <div id="progress-fill" class="progress-bar-inner bg-gradient-to-r from-green-400 to-blue-500 h-full w-0"></div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-6 shadow-2xl text-center mb-6 relative border-b-8 border-indigo-100">
            <div id="question-display" class="text-6xl font-black text-indigo-900 mb-4 tracking-tighter">2 × 3</div>
            <div id="answer-input" class="text-5xl font-black text-rose-500 h-20 flex items-center justify-center bg-gray-50 rounded-[1.5rem] border-4 border-dashed border-gray-200">?</div>
            <div id="feedback" class="h-8 mt-2 text-xl font-bold pointer-events-none"></div>
        </div>

        <div id="numpad" class="grid grid-cols-3 gap-3 px-1">
            <button onclick="pressKey(1)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">1</button>
            <button onclick="pressKey(2)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">2</button>
            <button onclick="pressKey(3)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">3</button>
            <button onclick="pressKey(4)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">4</button>
            <button onclick="pressKey(5)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">5</button>
            <button onclick="pressKey(6)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">6</button>
            <button onclick="pressKey(7)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">7</button>
            <button onclick="pressKey(8)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">8</button>
            <button onclick="pressKey(9)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">9</button>
            <button onclick="clearKey()" class="bg-gray-200 h-16 rounded-2xl text-2xl font-black text-gray-600 shadow-[0_6px_0_#94a3b8] active:translate-y-1 active:shadow-none">C</button>
            <button onclick="pressKey(0)" class="numpad-btn h-16 rounded-2xl text-3xl font-black text-indigo-800">0</button>
            <button id="ok-btn" onclick="submitAnswer()" class="bg-green-500 text-white h-16 rounded-2xl text-2xl font-black shadow-[0_6px_0_#15803d] active:translate-y-1 active:shadow-none">OK</button>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="hidden w-full max-w-md animate__animated animate__zoomIn text-center">
        <div class="bg-white rounded-[2.5rem] p-6 shadow-2xl border-8 border-indigo-50">
            <h2 class="text-3xl font-black text-indigo-600 mb-3">冒險結束！</h2>
            <div id="score-text" class="text-xl font-bold mb-6 text-rose-500"></div>
            
            <div class="mb-6 flex flex-col items-center">
                <p class="mb-3 text-orange-500 font-black text-lg">獲得夥伴卡片！</p>
                <div id="reward-card-container" class="w-48 h-64 rounded-3xl p-4"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="resetGame()" class="py-3 bg-green-500 text-white font-black text-lg rounded-xl shadow-[0_6px_0_#15803d]">再玩一次</button>
                <button onclick="returnToHome()" class="py-3 bg-gray-500 text-white font-black text-lg rounded-xl shadow-[0_6px_0_#334155]">回首頁</button>
            </div>
        </div>
    </div>

    <!-- 彈窗 -->
    <div id="modal" class="hidden fixed inset-0 modal-bg flex items-center justify-center p-6 z-50">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-6 relative shadow-2xl max-h-[80vh] overflow-y-auto border-8 border-indigo-50">
            <button onclick="closeModal()" class="absolute top-4 right-6 text-3xl text-gray-400 hover:text-rose-500">&times;</button>
            <h3 id="modal-title" class="text-2xl font-black text-indigo-600 mb-4"></h3>
            <div id="modal-content" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const gameState = {
            selectedNumbers: [],
            questions: [],
            currentIndex: 0,
            currentAnswer: "",
            score: 0,
            errors: [],
            collection: JSON.parse(localStorage.getItem('monster_master_col_v8') || '[]'),
            isProcessing: false,
            guardianTimer: null
        };

        const monsters = [
            { id: 1, name: "閃電喵", type: "雷", img: "⚡🐱", rarity: "Common" },
            { id: 2, name: "小火龍", type: "火", img: "🔥🐉", rarity: "Rare" },
            { id: 3, name: "噴水龜", type: "水", img: "💧🐢", rarity: "Common" },
            { id: 4, name: "唱歌鳥", type: "一般", img: "🎵🐦", rarity: "Common" },
            { id: 5, name: "綠葉怪", type: "草", img: "🍃🌱", rarity: "Common" },
            { id: 6, name: "超夢幻", type: "傳奇", img: "✨💎", rarity: "Legendary" },
            { id: 7, name: "紫幽靈", type: "幽靈", img: "🔮👻", rarity: "Rare" },
            { id: 8, name: "彩虹馬", type: "妖精", img: "🌈🦄", rarity: "Rare" }
        ];

        const selector = document.getElementById('number-selector');
        for (let i = 2; i <= 9; i++) {
            const btn = document.createElement('div');
            btn.className = 'bg-white border-4 border-indigo-100 p-3 rounded-xl text-center cursor-pointer font-black text-xl transition-all shadow-md text-indigo-300';
            btn.innerText = i;
            btn.dataset.num = i;
            btn.onclick = () => {
                btn.classList.toggle('bg-indigo-600');
                btn.classList.toggle('text-white');
                btn.classList.toggle('border-indigo-600');
                btn.classList.toggle('text-indigo-300');
                playSound('click');
            };
            selector.appendChild(btn);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const volume = 0.8;
            if(type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            } else if(type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function startGame() {
            const btns = document.querySelectorAll('#number-selector .bg-indigo-600');
            if (btns.length === 0) return;

            gameState.selectedNumbers = Array.from(btns).map(b => parseInt(b.dataset.num));
            generateQuestions();
            
            gameState.score = 0;
            gameState.currentIndex = 0;
            gameState.errors = [];
            gameState.isProcessing = false;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            
            updateQuestion();
        }

        function generateQuestions() {
            let pool = [];
            gameState.selectedNumbers.forEach(n => {
                for(let i=1; i<=9; i++) pool.push({a: n, b: i});
            });
            pool.sort(() => Math.random() - 0.5);
            gameState.questions = pool.slice(0, 10);
        }

        function updateQuestion() {
            // 安全檢查：若超出範圍則結算
            if(gameState.currentIndex >= 10 || !gameState.questions[gameState.currentIndex]) {
                showResults();
                return;
            }

            const q = gameState.questions[gameState.currentIndex];
            const qDisplay = document.getElementById('question-display');
            qDisplay.innerText = `${q.a} × ${q.b}`;
            
            qDisplay.classList.remove('animate__bounceIn');
            void qDisplay.offsetWidth; 
            qDisplay.classList.add('animate__animated', 'animate__bounceIn');
            
            document.getElementById('current-stage').innerText = gameState.currentIndex + 1;
            document.getElementById('progress-fill').style.width = (gameState.currentIndex / 10 * 100) + "%";
            document.getElementById('answer-input').innerText = "?";
            document.getElementById('feedback').innerText = "";
            
            document.getElementById('ok-btn').classList.remove('btn-locked-ui');
            
            gameState.currentAnswer = "";
            gameState.isProcessing = false;
            if (gameState.guardianTimer) clearTimeout(gameState.guardianTimer);
            
            speak(`${q.a} 乘以 ${q.b}`);
        }

        function pressKey(num) {
            if(gameState.isProcessing || gameState.currentAnswer.length >= 2) return;
            gameState.currentAnswer += num;
            document.getElementById('answer-input').innerText = gameState.currentAnswer;
            playSound('click');
        }

        function clearKey() {
            if(gameState.isProcessing) return;
            gameState.currentAnswer = "";
            document.getElementById('answer-input').innerText = "?";
            playSound('click');
        }

        function submitAnswer() {
            if(gameState.isProcessing || gameState.currentAnswer === "") return;
            
            gameState.isProcessing = true;
            document.getElementById('ok-btn').classList.add('btn-locked-ui');

            // 防鎖死計時器
            gameState.guardianTimer = setTimeout(() => {
                if(gameState.isProcessing) {
                    forceNext();
                }
            }, 1500);

            const q = gameState.questions[gameState.currentIndex];
            const correctVal = q.a * q.b;
            const userVal = parseInt(gameState.currentAnswer);
            const feedback = document.getElementById('feedback');

            if(userVal === correctVal) {
                gameState.score++;
                feedback.innerText = "正確 ✨";
                feedback.className = "h-8 mt-2 text-xl font-bold text-green-500 animate__animated animate__pulse";
                playSound('correct');
            } else {
                gameState.errors.push({
                    q: `${q.a} × ${q.b}`,
                    user: userVal,
                    correct: correctVal,
                    time: new Date().toLocaleTimeString()
                });
                feedback.innerText = `可惜！答案是 ${correctVal}`;
                feedback.className = "h-8 mt-2 text-xl font-bold text-rose-500 animate__animated animate__shakeX";
                playSound('wrong');
            }

            setTimeout(() => {
                forceNext();
            }, 1000);
        }

        function forceNext() {
            if (gameState.guardianTimer) clearTimeout(gameState.guardianTimer);
            gameState.isProcessing = false;

            // 修正：當 index 為 9 時，代表第 10 關剛結束（0-indexed），應進入結算
            if (gameState.currentIndex < 9) {
                gameState.currentIndex++;
                updateQuestion();
            } else {
                // 已完成第 10 關
                gameState.currentIndex = 10;
                document.getElementById('progress-fill').style.width = "100%";
                showResults();
            }
        }

        function showResults() {
            window.speechSynthesis.cancel();
            gameState.isProcessing = false;

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `本局得分：${gameState.score} / 10`;
            
            let pool = monsters;
            if(gameState.score === 10) pool = monsters.filter(m => m.rarity === 'Legendary' || m.rarity === 'Rare');
            else if(gameState.score < 5) pool = monsters.filter(m => m.rarity === 'Common');

            const reward = pool[Math.floor(Math.random() * pool.length)];
            
            if(!gameState.collection.find(m => m.id === reward.id)) {
                gameState.collection.push(reward);
                localStorage.setItem('monster_master_col_v8', JSON.stringify(gameState.collection));
            }

            renderCard(reward, 'reward-card-container');
            speak(`挑戰結束！恭喜獲得 ${reward.name}`);
        }

        function renderCard(monster, containerId) {
            const container = document.getElementById(containerId);
            container.className = `monster-card w-48 h-64 rounded-3xl p-4 flex flex-col items-center animate__animated animate__flipInY ${monster.rarity === 'Legendary' ? 'card-legendary' : (monster.rarity === 'Rare' ? 'card-rare' : '')}`;
            
            container.innerHTML = `
                <div class="bg-white/80 w-full flex-1 rounded-2xl flex items-center justify-center text-6xl mb-3 shadow-inner border-2 border-dashed border-indigo-100">
                    ${monster.img}
                </div>
                <div class="text-2xl font-black text-gray-800">${monster.name}</div>
                <div class="text-[10px] font-bold mt-1 uppercase tracking-widest px-3 py-0.5 rounded-full bg-white/50" style="color: ${monster.rarity === 'Legendary' ? '#b45309' : (monster.rarity === 'Rare' ? '#6d28d9' : '#4b5563')}">
                    ${monster.rarity}
                </div>
            `;
        }

        function returnToHome() {
            window.speechSynthesis.cancel();
            if (gameState.guardianTimer) clearTimeout(gameState.guardianTimer);
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            gameState.errors = [];
            gameState.isProcessing = false;
        }

        function resetGame() {
            startGame();
        }

        function showErrors() {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            title.innerText = "錯題筆記 📖";
            if(gameState.errors.length === 0) {
                content.innerHTML = `<div class="text-center py-6 text-gray-400 font-bold">目前沒有錯誤喔！</div>`;
            } else {
                content.innerHTML = gameState.errors.map(err => `
                    <div class="p-3 bg-rose-50 rounded-xl border-2 border-rose-100 flex justify-between items-center mb-2">
                        <div class="text-xl font-black text-indigo-900">${err.q}</div>
                        <div class="text-right">
                            <div class="text-rose-500 font-black text-sm">你答: ${err.user}</div>
                            <div class="text-green-600 font-black text-sm">正確: ${err.correct}</div>
                        </div>
                    </div>
                `).join('');
            }
            modal.classList.remove('hidden');
        }

        function showCollection() {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            title.innerText = "我的精靈圖鑑";
            if(gameState.collection.length === 0) {
                content.innerHTML = `<div class="text-center py-6 text-gray-400 font-bold">快去挑戰收集夥伴吧！</div>`;
            } else {
                content.innerHTML = `<div class="grid grid-cols-2 gap-3">
                    ${gameState.collection.map(m => `
                        <div class="p-3 border-2 rounded-xl bg-gray-50 flex flex-col items-center">
                            <div class="text-4xl mb-1">${m.img}</div>
                            <div class="font-black text-xs text-indigo-800">${m.name}</div>
                        </div>
                    `).join('')}
                </div>`;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
